quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.ssl.native=true
quarkus.vertx.prefer-native-transport=true

%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

quarkus.github-app.app-name=Technolinator
quarkus.github-app.read-config-files-from-source-repository=false
quarkus.github-app.app-id=${QUARKUS_GITHUB_APP_APP_ID}
quarkus.github-app.webhook-secret=${QUARKUS_GITHUB_APP_WEBHOOK_SECRET}
quarkus.github-app.private-key=${QUARKUS_GITHUB_APP_PRIVATE_KEY}

github.token=${GITHUB_TOKEN: }

dtrack.apikey=${DTRACK_APIKEY: }
%test.dtrack.apikey=test-dtrack-api-key
dtrack.url=${DTRACK_URL: }
%test.dtrack.url=http://localhost:${quarkus.wiremock.devservices.port}
dtrack.api_url=${DTRACK_API_URL:${dtrack.url}/api/v1}
# Dependency-Track processes BOMs asynchronously and overwrites project metadata while doing so,
# so project metadata is updated after the processing finished or the timeout elapsed
dtrack.bom_processing.timeout_seconds=${DTRACK_BOM_PROCESSING_TIMEOUT_SECONDS:300}
dtrack.bom_processing.poll_interval_millis=${DTRACK_BOM_PROCESSING_POLL_INTERVAL_MILLIS:2000}
%test.dtrack.bom_processing.poll_interval_millis=100
%test.dtrack.bom_processing.timeout_seconds=10

cdxgen.fail_on_error=${CDXGEN_FAIL_ON_ERROR:true}
cdxgen.use_gosum=${CDXGEN_USE_GOSUM:false}
%test.cdxgen.use_gosum=true
# passed as GOFLAGS to cdxgen: '-e' lets `go list` tolerate unresolvable packages, e.g. generated sources that are not committed
cdxgen.go_flags=${CDXGEN_GO_FLAGS:-e}
cdxgen.required_scope_only=${CDXGEN_REQUIRED_SCOPE_ONLY_DEFAULT:false}
cdxgen.prefer_mvn_deps_tree=${CDXGEN_PREFER_MAVEN_DEPS_TREE_DEFAULT:true}
cdxgen.evidence=${CDXGEN_EVIDENCE_DEFAULT:false}
cdxgen.formulation=${CDXGEN_FORMULATION_DEFAULT:false}
cdxgen.debug=${CDXGEN_DEBUG:false}

grype.template=${GRYPE_TEMPLATE:src/main/docker/assets/grype.tmpl}
grype.config=${GRYPE_CONFIG}

depscan.template=${DEPSCAN_TEMPLATE:src/main/docker/assets/depscan.j2}

analysis.recursive_default=${ANALYSIS_RECURSIVE_DEFAULT:true}

app.use_pending_commit_status=${APP_USE_PENDING_COMMIT_STATUS:false}
app.commit_status_write.enabled=${APP_COMMIT_STATUS_WRITE_ENABLED:true}
app.clean_wrapper_scripts=${APP_CLEAN_WRAPPER_SCRIPTS:false}
app.always_use_version_or_commit_hash=${APP_ALWAYS_USE_VERSION_OR_COMMIT_HASH:false}

%test.app.clean_wrapper_scripts=${APP_CLEAN_WRAPPER_SCRIPTS:false}

app.exclude_github_folder=${APP_EXCLUDE_GITHUB_FOLDER:false}

app.allowed_env_substitutions=${ALLOWED_ENV_SUBSTITUTIONS: }
app.analysis.cdxgen.inherited_env=${APP_CDXGEN_INHERITED_ENV: }

app.enabled_repos=${APP_ENABLED_REPOS: }
app.analysis_timeout=${APP_ANALYSIS_TIMEOUT:60M}
app.analysis.cdxgen.fetch_licenses=${APP_ANALYSIS_CDXGEN_FETCH_LICENSES:false}

app.pull_requests.ignore_bots=${APP_PULL_REQUESTS_IGNORE_BOTS:true}
app.pull_requests.enabled=${APP_PULL_REQUESTS_ENABLED:true}
app.pull_requests.concurrency_limit=${APP_PULL_REQUESTS_CONCURRENCY_LIMIT:3}
app.pull_requests.cdxgen.fetch_licenses=${APP_PULL_REQUESTS_CDXGEN_FETCH_LICENSES:false}

# depscan | grype
app.pull_requests.analyzer=${APP_PULL_REQUESTS_ANALYZER:depscan}

app.archive_projects.enabled=${APP_ARCHIVE_PROJECTS_ENABLED:true}

app.rename_projects.enabled=${APP_RENAME_PROJECTS_ENABLED:true}

app.publish_repo_metrics=${APP_PUBLISH_REPO_METRICS:true}

# Scheduled housekeeping, walks through all repositories of all GitHub app installations and all Dependency-Track projects once, see docs/Housekeeping.md
app.housekeeping.enabled=${APP_HOUSEKEEPING_ENABLED:false}
# Quartz style cron expression, default: every night at 02:00
app.housekeeping.cron=${APP_HOUSEKEEPING_CRON:0 0 2 * * ?}
# Actions are expected to only log what they would do, instead of changing anything
app.housekeeping.dry_run=${APP_HOUSEKEEPING_DRY_RUN:false}
# Limit of the whole run
app.housekeeping.timeout=${APP_HOUSEKEEPING_TIMEOUT:4H}
# Limit of a single action invocation for a repository and its projects
app.housekeeping.task_timeout=${APP_HOUSEKEEPING_TASK_TIMEOUT:5M}
# Number of installations listed in parallel
app.housekeeping.installation_concurrency=${APP_HOUSEKEEPING_INSTALLATION_CONCURRENCY:4}
# Number of repositories (with their projects) processed in parallel
app.housekeeping.worker_concurrency=${APP_HOUSEKEEPING_WORKER_CONCURRENCY:4}

# Archives Dependency-Track projects, whose GitHub repository doesn't exist anymore or got archived
app.housekeeping.archive-orphaned-projects.enabled=${APP_HOUSEKEEPING_ARCHIVE_ORPHANED_PROJECTS_ENABLED:true}
%test.app.housekeeping.archive-orphaned-projects.enabled=false
app.housekeeping.archive-orphaned-projects.max-per-run=${APP_HOUSEKEEPING_ARCHIVE_ORPHANED_PROJECTS_MAX_PER_RUN:500}

# Archives child Dependency-Track projects of an active GitHub repository, whose module isn't described by the repository's technolinator.yml anymore
app.housekeeping.archive-removed-modules.enabled=${APP_HOUSEKEEPING_ARCHIVE_REMOVED_MODULES_ENABLED:true}
%test.app.housekeeping.archive-removed-modules.enabled=false
app.housekeeping.archive-removed-modules.max-per-run=${APP_HOUSEKEEPING_ARCHIVE_REMOVED_MODULES_MAX_PER_RUN:500}

# Adds the references to the GitHub repository and the tags (owner, topics) to Dependency-Track projects definitely belonging to it, that lack them
app.housekeeping.update-project-metadata.enabled=${APP_HOUSEKEEPING_UPDATE_PROJECT_METADATA_ENABLED:true}
%test.app.housekeeping.update-project-metadata.enabled=false
app.housekeeping.update-project-metadata.max-per-run=${APP_HOUSEKEEPING_UPDATE_PROJECT_METADATA_MAX_PER_RUN:1000}

# Reactivates archived Dependency-Track projects definitely belonging to an active GitHub repository (and not superseded by an active version)
app.housekeeping.reactivate-projects.enabled=${APP_HOUSEKEEPING_REACTIVATE_PROJECTS_ENABLED:true}
%test.app.housekeeping.reactivate-projects.enabled=false
app.housekeeping.reactivate-projects.max-per-run=${APP_HOUSEKEEPING_REACTIVATE_PROJECTS_MAX_PER_RUN:500}

# Renames the Dependency-Track projects of a GitHub repository that got renamed, if the rename event wasn't handled (e.g. missed)
app.housekeeping.follow-renamed-repositories.enabled=${APP_HOUSEKEEPING_FOLLOW_RENAMED_REPOSITORIES_ENABLED:true}
%test.app.housekeeping.follow-renamed-repositories.enabled=false
app.housekeeping.follow-renamed-repositories.max-per-run=${APP_HOUSEKEEPING_FOLLOW_RENAMED_REPOSITORIES_MAX_PER_RUN:500}

app.repo.backstage_annotation_regex=${APP_REPO_BACKSTAGE_ANNOTATION_REGEX: }
%test.app.repo.backstage_annotation_regex=github\.com\/.*

# Reporting of failed analyses to the repositories, see docs/Analysis.md
# on (default): status issue for the default branch, status in the pull-request comment
# dry-run: only logs what would be reported, off: nothing is reported
app.failure_reporting.mode=${APP_FAILURE_REPORTING_MODE:on}
%test.app.failure_reporting.mode=off
# Names of the repositories to report for, empty: all
app.failure_reporting.repos=${APP_FAILURE_REPORTING_REPOS: }
# Logs of the analysed code of pull-requests from forks are untrusted, so they are omitted by default
app.failure_reporting.include_log_on_fork_prs=${APP_FAILURE_REPORTING_INCLUDE_LOG_ON_FORK_PRS:false}
# Number of timeouts in a row of the same branch, until it is reported as a failure of the repository
app.failure_reporting.timeouts_before_report=${APP_FAILURE_REPORTING_TIMEOUTS_BEFORE_REPORT:2}
# Login of the GitHub app, defaults to the slug of the app with the suffix [bot]. Used to find the issues and comments written by the app
app.failure_reporting.bot_login=${APP_FAILURE_REPORTING_BOT_LOGIN:}

quarkus.log.category."com.mediamarktsaturn.technolinator.os.ProcessCallback$DefaultProcessCallback".level=${APP_PROCESS_LOGLEVEL:INFO}

# build config
quarkus.native.additional-build-args=-H:ResourceConfigurationFiles=resources-config.json
